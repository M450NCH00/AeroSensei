server.port=8081

# Set to true only in production (HTTPS). False allows cookies over HTTP in local dev.
app.secure-cookies=false
# NOTE: CORS is handled by the nginx reverse proxy, not Spring (see SecurityConfig).
spring.application.name=backend

# JWT Configuration
# The secret must be at least 256 bits (32 characters) long for HMAC-SHA, this is only using in development, in production need to change to a secret keyx
jwt.secret=${JWT_SECRET:aerosensei-super-secret-key-that-is-at-least-32-chars-long!}
# 15 minutes in milliseconds (15 * 60 * 1000)
jwt.expiration.access=900000
# 7 days in milliseconds (7 * 24 * 60 * 60 * 1000)
jwt.expiration.refresh=604800000

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgresdb}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:ChangeThisPassword123!}
spring.datasource.driver-class-name=org.postgresql.Driver

# INFLUXDB CONFIG
influxdb.url=${INFLUX_URL:http://influxdb:8086}
influxdb.token=${INFLUX_TOKEN:my-super-secret-admin-token-12345}
influxdb.org=${INFLUX_ORG:my-org}
influxdb.bucket=${INFLUX_BUCKET:sensors_data}

# NIGHTLY PM BREACH CHECK
# Averages each site's last-24h PM2.5/PM10 and records pm_alerts rows when the
# site exceeds Vietnam's QCVN 05:2023 24h limits (>=80% = WARNING, >100% = BREACHED).
# cron is a Spring 6-field expression; default = midnight every night (Asia/Ho_Chi_Minh).
pm.alert.cron=0 0 0 * * *
pm.alert.threshold.pm25=45
pm.alert.threshold.pm10=100
pm.alert.warning-fraction=0.8

#REDIS CONFIG
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=6379

# KAFKA CONFIG
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Disable Spring Boot's Kafka auto-config for producer/consumer — KafkaConfig.java handles it
spring.kafka.producer.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Agent API Configuration
# agent.api.secret is also used by PmAlertSchedulerService for the nightly /enforce hand-off.
agent.api.secret=${INTERNAL_API_SECRET:abcd1234}

# AUTO-FINE ENFORCEMENT
# After the nightly PM check, optionally have the AI agent autonomously issue
# fines for every BREACHED, un-fined alert. OFF by default — auto-issuing monetary
# penalties is consequential; enable explicitly (the agent side must also set
# ENFORCEMENT_AUTO_FINE=true). Reuses agent.api.secret as the internal secret.
agent.enforce.enabled=${ENFORCEMENT_AUTO_FINE:false}
agent.enforce.url=http://ai-agent:5001/enforce

# CITY-WIDE MINISTRY ESCALATION
# Periodically classifies every live sensor; when >= warning/breached fraction of
# them are unhealthy, hands off to the AI agent's /ministry-alert endpoint, which
# emails tailored directives to the relevant ministries. Reuses agent.api.secret.
escalation.enabled=${ESCALATION_ENABLED:true}
escalation.check.rate-ms=${ESCALATION_CHECK_RATE_MS:900000}
escalation.warning-fraction=${ESCALATION_WARNING_FRACTION:0.5}
escalation.breached-fraction=${ESCALATION_BREACHED_FRACTION:0.5}
escalation.cooldown-minutes=${ESCALATION_COOLDOWN_MINUTES:360}
agent.ministry.url=http://ai-agent:5001/ministry-alert
