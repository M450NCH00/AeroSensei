spring.application.name=backend

# JWT Configuration
# The secret must be at least 256 bits (32 characters) long for HMAC-SHA, this is only using in development, in production need to change to a secret keyx
jwt.secret=${JWT_SECRET:default-local-dev-secret-key-change-in-production}
# 15 minutes in milliseconds (15 * 60 * 1000)
jwt.expiration.access=900000
# 7 days in milliseconds (7 * 24 * 60 * 60 * 1000)
jwt.expiration.refresh=604800000

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://postgresdb:5432/postgresdb}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:ChangeThisPassword123!}
spring.datasource.driver-class-name=org.postgresql.Driver

# INFLUXDB CONFIG
influxdb.url=http://influxdb:8086
influxdb.token=my-super-secret-admin-token-12345
influxdb.org=aerosensei_org
influxdb.bucket=sensor_data
