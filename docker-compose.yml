services:
  # --- MESSAGE BROKER ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-broker
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8888:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # --- TIME-SERIES DATABASE (Sensor Readings) ---
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
      - ./influxdb:/docker-entrypoint-initdb.d:ro
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password
      - DOCKER_INFLUXDB_INIT_ORG=my-org
      - DOCKER_INFLUXDB_INIT_BUCKET=sensors_data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-admin-token-12345

  # --- RELATIONAL DATABASE (Sensor Metadata & Coordinates) ---
  postgres:
    image: postgres:16
    container_name: postgresdb
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgresql/query/role_permissions_initialization.sql:/docker-entrypoint-initdb.d/user_roles_initialization.sql
      - ./postgresql/query/user_registry_initialization.sql:/docker-entrypoint-initdb.d/2_user_registry_initialization.sql
      - ./postgresql/query/company_registry_initialization.sql:/docker-entrypoint-initdb.d/3_company_registry_initialization.sql
      - ./postgresql/query/sensor_registry_initialization.sql:/docker-entrypoint-initdb.d/4_sensor_registry_initialization.sql
      - ./postgresql/query/alert_registry_initialization.sql:/docker-entrypoint-initdb.d/5_alert_registry_initialization.sql
      - ./postgresql/query/carbon_transactions_initialization.sql:/docker-entrypoint-initdb.d/6_carbon_transactions_initialization.sql
      - ./postgresql/query/carbon_listings_initialization.sql:/docker-entrypoint-initdb.d/7_carbon_listings_initialization.sql
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=ChangeThisPassword123!
      - POSTGRES_DB=postgresdb

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin

  redis:
    image: redis:7-alpine
    container_name: aerosensei-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: ./backend # Points to the folder containing your new Dockerfile
    container_name: aerosensei-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - influxdb
      - redis
      - kafka
    environment:
      - DB_URL=jdbc:postgresql://postgresdb:5432/postgresdb
      - DB_USER=admin
      - DB_PASSWORD=ChangeThisPassword123!
      - JWT_SECRET=your-hackathon-super-secret-key-xyz123
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092

  # --- AI AGENT ---
  ai-agent:
    build:
      context: ./ai_agent
      dockerfile: Dockerfile
    container_name: ai-agent
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./aerosense-kinetic
      dockerfile: Dockerfile
    image: aerosense-frontend:latest
    container_name: aerosense-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - ai-agent
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_AI_AGENT_URL=http://localhost:5001

  # --- OBJECT STORAGE (MinIO) ---
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/minio:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set dockerminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb dockerminio/influx-backups;
      exit 0;
      "

  backup-cron:
    build:
      context: ./s3
      dockerfile: Dockerfile
    container_name: influx-backup-cron
    restart: unless-stopped
    depends_on:
      - influxdb
      - minio
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=my-super-secret-admin-token-12345
      - INFLUX_ORG=my-org
      - INFLUX_BUCKET=sensors_data
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - BUCKET_NAME=influx-backups

volumes:
  influxdb-data:
  influxdb-config:
  postgres-data:
  minio-data:
