services:
  # --- TIME-SERIES DATABASE (Sensor Readings) ---
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password
      - DOCKER_INFLUXDB_INIT_ORG=my-org
      - DOCKER_INFLUXDB_INIT_BUCKET=my-bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-admin-token-12345

  influx-init:
    image: alpine:3.19
    container_name: influx-init
    depends_on:
      - influxdb
    environment:
      - INFLUX_TOKEN=my-super-secret-admin-token-12345
      - INFLUX_ORG=my-org
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache curl jq > /dev/null

        until curl -fsS http://influxdb:8086/health | grep '"status":"pass"'; do
          echo "waiting for influx..."
          sleep 2
        done

        ORG_ID=$$(curl -s http://influxdb:8086/api/v2/orgs \
          -H "Authorization: Token $$INFLUX_TOKEN" \
          | jq -r '.orgs[0].id')

        echo "Org ID: $$ORG_ID"

        curl -s -X POST http://influxdb:8086/api/v2/buckets \
          -H "Authorization: Token $$INFLUX_TOKEN" \
          -H "Content-type: application/json" \
          -d "{\"name\":\"sensors_data\",\"orgID\":\"$$ORG_ID\",\"retentionRules\":[{\"type\":\"expire\",\"everySeconds\":2592000}]}"

        echo "Done."

  # --- RELATIONAL DATABASE (Sensor Metadata & Coordinates) ---
  postgres:
    image: postgres:16
    container_name: postgresdb
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./DatabaseSQL/Query/sensor_registry_initialization.sql:/docker-entrypoint-initdb.d/sensor_registry_initialization.sql
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=ChangeThisPassword123!
      - POSTGRES_DB=sensor_metadata

  # --- OBJECT STORAGE (MinIO) ---
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  influxdb-data:
  influxdb-config:
  postgres-data:
  minio-data:
